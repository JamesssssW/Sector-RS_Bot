name: Daily Sector RS Ranking

on:
  schedule:
    # 星期二至六（美股交易日翌日清晨）的 UTC 13:00、15:00、17:00、19:00、21:00 運行
    # 對應香港時間夜晚到凌晨開市時段
    - cron: '0 13,15,17,19,21 * * 2-6'
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: write # 必須開啟寫入權限，才能儲存 history.json

jobs:
  run-rs-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily sector RS history" && git push)
