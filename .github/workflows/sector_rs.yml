name: Daily Sector RS Ranking

on:
  schedule:    # 預設在美股收盤後的香港時間每日早上 6:30 運行 (UTC 22:30，星期二至六)
    - cron: '30 22 * * 2-6' # Runs at 22:30, Tuesday through Saturday
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

permissions:
  contents: write # 必須開啟寫入權限，才能儲存 history.json

jobs:
  run-rs-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily sector RS history" && git push)
